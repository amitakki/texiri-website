xt x="128" y="556" fill="#4a5670" font-size="20" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="end">13:30</text><circle cx="150" cy="548" r="10" fill="#2bb5e8" /><g filter="url(#sh2)"><rect x="180" y="506" width="640" height="84" rx="10" fill="#ffffff" /></g><text x="204" y="542" fill="#0f1a2e" font-size="23" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Score</text><text x="204" y="572" fill="#4a5670" font-size="18" font-weight="600" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Value, data readiness, feasibility and risk</text><rect x="850" y="506" width="290" height="84" rx="10" fill="#e3f4fb" /><text x="882" y="561" fill="#0f1a2e" font-size="40" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >12</text><text x="950" y="558" fill="#0f1a2e" font-size="20" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >scored</text><text x="128" y="658" fill="#4a5670" font-size="20" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="end">15:00</text><circle cx="150" cy="650" r="10" fill="#2bb5e8" /><g filter="url(#sh2)"><rect x="180" y="608" width="640" height="84" rx="10" fill="#ffffff" /></g><text x="204" y="644" fill="#0f1a2e" font-size="23" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Rank and choose</text><text x="204" y="674" fill="#4a5670" font-size="18" font-weight="600" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Data and risk act as gates; then value decides</text><rect x="850" y="608" width="290" height="84" rx="10" fill="#2bb5e8" /><text x="882" y="663" fill="#0f1a2e" font-size="40" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >3</text><text x="950" y="660" fill="#0f1a2e" font-size="20" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >shortlisted</text><text x="128" y="760" fill="#4a5670" font-size="20" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="end">16:30</text><circle cx="150" cy="752" r="10" fill="#fc9a3a" /><g filter="url(#sh2)"><rect x="180" y="710" width="640" height="84" rx="10" fill="#ffffff" /></g><text x="204" y="746" fill="#0f1a2e" font-size="23" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Next steps</text><text x="204" y="776" fill="#4a5670" font-size="18" font-weight="600" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Owners, data checks and the proposed pilot</text><rect x="850" y="710" width="290" height="84" rx="10" fill="#0f1a2e" /><text x="882" y="765" fill="#fc9a3a" font-size="40" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >1</text><text x="950" y="762" fill="#f5f4f1" font-size="20" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >proposed pilot</text><text x="1140" y="870" fill="#8993a8" font-size="20" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="end">Sample data</text></svg>
