<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><defs><filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f1a2e" flood-opacity="0.2"/></filter>
<filter id="sh2" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f1a2e" flood-opacity="0.18"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter><linearGradient id="g210" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f4f1"/><stop offset="1" stop-color="#e3f4fb"/></linearGradient></defs><rect width="1200" height="900" fill="url(#g210)"/><text x="60" y="110" fill="#0f1a2e" font-size="44" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Two ways to pick a first pilot</text><g filter="url(#sh)"><rect x="60" y="170" width="520" height="660" rx="16" fill="#ffffff" /></g><path d="M60,234 V186 a16,16 0 0 1 16,-16 h488 a16,16 0 0 1 16,16 V234 Z" fill="#ebe9e4"/><text x="90" y="212" fill="#4a5670" font-size="22" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" letter-spacing="2">TECHNOLOGY FIRST</text><rect x="90" y="262" width="460" height="90" rx="12" fill="#0f1a2e" /><text x="320" y="317" fill="#f5f4f1" font-size="24" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">“Let’s build a chatbot.”</text><circle cx="116" cy="410" r="16" fill="#fc9a3a" /><rect x="114.72" y="402" width="2.56" height="9.92" fill="#0f1a2e" rx="0.96"/><circle cx="116" cy="417.36" r="1.76" fill="#0f1a2e" /><text x="146" y="418" fill="#4a5670" font-size="21" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Who will use it?</text><line x1="90" y1="445" x2="550" y2="445" stroke="#e2dfda" stroke-width="2" /><circle cx="116" cy="480" r="16" fill="#fc9a3a" /><rect x="114.72" y="472" width="2.56" height="9.92" fill="#0f1a2e" rx="0.96"/><circle cx="116" cy="487.36" r="1.76" fill="#0f1a2e" /><text x="146" y="488" fill="#4a5670" font-size="21" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Which data does it need?</text><line x1="90" y1="515" x2="550" y2="515" stroke="#e2dfda" stroke-width="2" /><circle cx="116" cy="550" r="16" fill="#fc9a3a" /><rect x="114.72" y="542" width="2.56" height="9.92" fill="#0f1a2e" rx="0.96"/><circle cx="116" cy="557.36" r="1.76" fill="#0f1a2e" /><text x="146" y="558" fill="#4a5670" font-size="21" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >How will we measure it?</text><line x1="90" y1="585" x2="550" y2="585" stroke="#e2dfda" stroke-width="2" /><rect x="90" y="660" width="460" height="130" rx="12" fill="#fbe3e0" /><circle cx="134" cy="725" r="22" fill="#d6453d" /><rect x="132.24" y="714" width="3.52" height="13.64" fill="#ffffff" rx="1.3199999999999998"/><circle cx="134" cy="735.12" r="2.42" fill="#ffffff" /><text x="172" y="716" fill="#d6453d" font-size="25" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >The demo works, then stalls</text><text x="172" y="752" fill="#4a5670" font-size="19" font-weight="600" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >No owner, no data, no KPI</text><g filter="url(#sh)"><rect x="620" y="170" width="520" height="660" rx="16" fill="#ffffff" /></g><path d="M620,234 V186 a16,16 0 0 1 16,-16 h488 a16,16 0 0 1 16,16 V234 Z" fill="#2bb5e8"/><text x="650" y="212" fill="#0f1a2e" font-size="22" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" letter-spacing="2">PROBLEM FIRST</text><rect x="650" y="262" width="460" height="90" rx="12" fill="#0f1a2e" /><text x="880" y="317" fill="#f5f4f1" font-size="24" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">“Invoices take 6 days to post.”</text><circle cx="676" cy="410" r="16" fill="#2f9e6b" /><polyline points="668.8,410.32 674.4,415.76 684,404.56" fill="none" stroke="#ffffff" stroke-width="3.52" stroke-linecap="round" stroke-linejoin="round"/><text x="706" y="418" fill="#0f1a2e" font-size="21" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Owner: accounts payable lead</text><line x1="650" y1="445" x2="1110" y2="445" stroke="#e2dfda" stroke-width="2" /><circle cx="676" cy="480" r="16" fill="#2f9e6b" /><polyline points="668.8,480.32 674.4,485.76 684,474.56" fill="none" stroke="#ffffff" stroke-width="3.52" stroke-linecap="round" stroke-linejoin="round"/><text x="706" y="488" fill="#0f1a2e" font-size="21" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Data: invoices and orders in ERP</text><line x1="650" y1="515" x2="1110" y2="515" stroke="#e2dfda" stroke-width="2" /><circle cx="676" cy="550" r="16" fill="#2f9e6b" /><polyline points="668.8,550.32 674.4,555.76 684,544.56" fill="none" stroke="#ffffff" stroke-width="3.52" stroke-linecap="round" stroke-linejoin="round"/><text x="706" y="558" fill="#0f1a2e" font-size="21" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >KPI: days to post, 6 → 2</text><line x1="650" y1="585" x2="1110" y2="585" stroke="#e2dfda" stroke-width="2" /><rect x="650" y="660" width="460" height="130" rx="12" fill="#dff3e8" /><circle cx="694" cy="725" r="22" fill="#2f9e6b" /><polyline points="684.1,725.44 691.8,732.92 705,717.52" fill="none" stroke="#ffffff" stroke-width="4.84" stroke-linecap="round" stroke-linejoin="round"/><text x="732" y="716" fill="#2f9e6b" font-size="25" font-weight="800" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >A pilot with a target</text><text x="732" y="752" fill="#4a5670" font-size="19" font-weight="600" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" >Measured from the first day</text><text x="1140" y="870" fill="#8993a8" font-size="20" font-weight="700" font-family="Archivo, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="end">Sample values</text></svg>
